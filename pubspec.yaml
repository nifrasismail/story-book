name: kidstories
description: A magical storybook app for kids — stories, rewards, and adventures!

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local storage
  shared_preferences: ^2.3.2

  # Push / local notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # AdMob
  google_mobile_ads: ^5.2.0

  # In-app purchases
  in_app_purchase: ^3.2.0

  # Typography
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0
  confetti: ^0.7.0

  # Page indicator
  smooth_page_indicator: ^1.2.0

  # Progress / badges
  percent_indicator: ^4.2.3

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
